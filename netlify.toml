# Déploiement Netlify : build Vite, site statique dans dist/.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fichiers à hachage : cache long. index.html reste toujours frais.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Identité OAuth de l'app (Client ID Metadata Document, spécification MCP 2026-07-28) :
# les serveurs d'autorisation la lisent pour afficher le nom, le logo et les retours permis.
[[headers]]
  for = "/oauth/client.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=3600"
