<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Toolbox : tes agents IA, toujours à portée de clic</title>
    <meta
      name="description"
      content="Crée tes propres agents IA, chacun avec sa personnalité. Ils vivent dans une petite icône flottante sur ton Mac. Inscris-toi pour être prévenu du lancement."
    />
    <meta name="theme-color" content="#0e1014" />
    <script>
      // Thème posé avant le premier affichage (même règle que src/lib/theme.ts) :
      // sur mobile, toujours le thème du système ; ailleurs, le choix enregistré s'il existe.
      (function () {
        var t = null
        if (!matchMedia('(max-width: 767px)').matches) {
          try { t = localStorage.getItem('theme') } catch (e) {}
        }
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
        document.querySelector('meta[name="theme-color"]').content = t === 'light' ? '#f6f7f4' : '#0e1014'
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/bricolage-grotesque-latin-opsz.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Agent Toolbox : tes agents IA, toujours à portée de clic" />
    <meta
      property="og:description"
      content="Des agents IA avec du caractère, qui vivent dans un coin de ton écran. Rien ne part sans ton feu vert."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

  </head>
  <body>
    <div id="root"></div>
    <!-- Formulaire statique : permet à Netlify Forms de détecter la liste d'attente au build. -->
    <form name="lancement" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
