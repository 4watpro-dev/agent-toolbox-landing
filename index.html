<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Toolbox : tes agents IA, toujours à portée de clic</title>
    <meta
      name="description"
      content="Crée tes propres agents IA, chacun avec sa personnalité. Ils vivent dans une petite icône flottante sur ton bureau. Gratuit pour macOS et Windows."
    />
    <meta name="theme-color" content="#0e1014" />
    <script>
      // Thème posé avant le premier affichage : choix enregistré, sinon thème du système.
      (function () {
        var t = null
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
        document.querySelector('meta[name="theme-color"]').content = t === 'light' ? '#f6f7f4' : '#0e1014'
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Agent Toolbox : tes agents IA, toujours à portée de clic" />
    <meta
      property="og:description"
      content="Des agents IA avec du caractère, qui vivent dans un coin de ton écran. Rien ne part sans ton feu vert."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Polices chargées sans bloquer le premier affichage. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
